<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="images/Shalom-Park.ico" type="image/x-icon">
    <title>Calendrier de Réservations Shalom Park</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #e9ecef;
        }

        .header h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .nav-btn {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .nav-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .month-year {
            font-size: 1.8em;
            font-weight: 700;
            color: #333;
            min-width: 250px;
            text-align: center;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
            background: #f8f9fa;
            border-radius: 15px;
            padding: 10px;
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.05);
        }

        .calendar-header {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            padding: 15px;
            text-align: center;
            font-weight: 600;
            font-size: 14px;
            border-radius: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .calendar-day {
            background: white;
            border: 2px solid transparent;
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            min-height: 80px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }

        .calendar-day:hover {
            border-color: #667eea;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
        }

        .calendar-day.other-month {
            color: #ccc;
            background: #f8f9fa;
        }

        .calendar-day.today {
            background: linear-gradient(45deg, #ffeaa7, #fdcb6e);
            font-weight: bold;
            color: #333;
        }

        .calendar-day.reserved {
            background: linear-gradient(45deg, #fd79a8, #fdcb6e);
            color: white;
            font-weight: bold;
        }

        .calendar-day.reserved:hover {
            border-color: #fd79a8;
        }

        .day-number {
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 5px;
        }

        .reservation-info {
            font-size: 10px;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            padding: 2px 6px;
            border-radius: 12px;
            text-overflow: ellipsis;
            overflow: hidden;
            white-space: nowrap;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
        }

        
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 10px; /* enlever les coins arrondis si tu veux un effet plein écran strict */
            width: 90%;
            height: 80%;
            margin: 10px;
            box-shadow: none; /* facultatif, à enlever pour un style plat */
            animation: modalSlideIn 0.3s ease;
            overflow: auto; /* pour scroller si le contenu dépasse */
        }
        @keyframes modalSlideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .close:hover {
            color: #333;
        }

        .form-row {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .form-row .form-group {
            flex: 1;
            margin-bottom: 0;
        }

        .form-section {
            margin-bottom: 25px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 12px;
            border-left: 4px solid #667eea;
        }

        .form-section h3 {
            margin-bottom: 15px;
            color: #333;
            font-size: 1.2em;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .datetime-group {
            display: flex;
            gap: 10px;
            align-items: end;
        }

        .datetime-group .form-group {
            flex: 1;
            margin-bottom: 0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .btn {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            margin-right: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-delete {
            background: linear-gradient(45deg, #e17055, #d63031);
        }

        .btn-delete:hover {
            box-shadow: 0 6px 20px rgba(214, 48, 49, 0.4);
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 50%;
        }

        .legend-today {
            background: linear-gradient(45deg, #ffeaa7, #fdcb6e);
        }

        .legend-reserved {
            background: linear-gradient(45deg, #fd79a8, #fdcb6e);
        }

        .export-section {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 15px;
            text-align: center;
        }

        .export-section h3 {
            margin-bottom: 15px;
            color: #333;
        }

        @media (max-width: 768px) {
            .calendar-grid {
                gap: 1px;
            }
            
            .calendar-day {
                min-height: 60px;
                padding: 8px;
            }
            
            .controls {
                flex-direction: column;
                gap: 15px;
            }
            
            .month-year {
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📅 Calendrier de Réservations Shalom Park</h1>
            <p>Cliquez sur une date pour ajouter ou modifier une réservation</p>
        </div>

        <div class="controls">
            <button class="nav-btn" onclick="previousMonth()">← Mois précédent</button>
            <div class="month-year" id="monthYear"></div>
            <button class="nav-btn" onclick="nextMonth()">Mois suivant →</button>
        </div>

        <div class="calendar-grid" id="calendar">
            <!-- Le calendrier sera généré ici -->
        </div>

        <div class="legend">
            <div class="legend-item">
                <div class="legend-color legend-today"></div>
                <span>Aujourd'hui</span>
            </div>
            <div class="legend-item">
                <div class="legend-color legend-reserved"></div>
                <span>Réservé</span>
            </div>
        </div>

        <div class="export-section">
            <h3>Gestion des données</h3>
            <button class="btn" onclick="exportData()">📥 Exporter les données</button>
            <button class="btn" onclick="document.getElementById('importFile').click()">📤 Importer des données</button>
            <input type="file" id="importFile" style="display: none" accept=".json" onchange="importData(event)">
        </div>
    </div>

    <!-- Modal pour les réservations -->
    <div id="reservationModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2 id="modalTitle">Nouvelle Réservation</h2>
            <form id="reservationForm">
                <div class="form-group">
                    <label for="title">Nom Prénom *:</label>
                    <input type="text" id="title" name="title" required>
                </div>
                <div class="form-group">
                    <label for="phone">Téléphone *</label>
                    <input type="tel" id="phone" name="phone" required>
                </div>
                <div class="form-group">
                    <label for="time">Heure d'arrivé *:</label>
                    <input type="time" id="time" name="time" required>
                </div>
                <div class="form-group">
                    <label for="personCount">Nombre de personnes *</label>
                    <input type="number" id="personCount" name="personCount" min="1" max="100" required>
                </div>
                <div class="form-group">
                    <label for="description">Description :</label>
                    <textarea id="description" name="description" placeholder="Détails de la réservation..."></textarea>
                </div>
                
                <button type="submit" class="btn">Enregistrer</button>
                <button type="button" class="btn btn-delete" id="deleteBtn" onclick="deleteReservation()" style="display: none;">Supprimer</button>
            </form>
        </div>
    </div>

    <script>
        let currentDate = new Date();
        let selectedDate = null;
        let reservations = {};

        // Charger les données depuis localStorage
        function loadData() {
            const saved = localStorage.getItem('calendar-reservations');
            if (saved) {
                reservations = JSON.parse(saved);
            }
        }

        // Sauvegarder les données dans localStorage
        function saveData() {
            localStorage.setItem('calendar-reservations', JSON.stringify(reservations));
        }

        // Générer le calendrier
        function generateCalendar() {
            const calendar = document.getElementById('calendar');
            const monthYear = document.getElementById('monthYear');
            
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            
            // Mise à jour du titre
            monthYear.textContent = currentDate.toLocaleDateString('fr-FR', { 
                month: 'long', 
                year: 'numeric' 
            });
            
            // Vider le calendrier
            calendar.innerHTML = '';
            
            // Headers des jours
            const dayHeaders = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'];
            dayHeaders.forEach(day => {
                const header = document.createElement('div');
                header.className = 'calendar-header';
                header.textContent = day;
                calendar.appendChild(header);
            });
            
            // Premier jour du mois et nombre de jours
            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const startDate = new Date(firstDay);
            startDate.setDate(startDate.getDate() - ((firstDay.getDay() + 6) % 7));
            
            const today = new Date();
            
            // Générer 6 semaines
            for (let i = 0; i < 42; i++) {
                const cellDate = new Date(startDate);
                cellDate.setDate(startDate.getDate() + i);
                
                const dayElement = document.createElement('div');
                dayElement.className = 'calendar-day';
                
                const dayNumber = document.createElement('div');
                dayNumber.className = 'day-number';
                dayNumber.textContent = cellDate.getDate();
                
                // Classes CSS
                if (cellDate.getMonth() !== month) {
                    dayElement.classList.add('other-month');
                }
                
                if (cellDate.toDateString() === today.toDateString()) {
                    dayElement.classList.add('today');
                }
                
                const dateKey = cellDate.toISOString().split('T')[0];
                if (reservations[dateKey]) {
                    dayElement.classList.add('reserved');
                    const reservationInfo = document.createElement('div');
                    reservationInfo.className = 'reservation-info';
                    const reservation = reservations[dateKey];
                    const displayText = `${reservation.title} (${reservation.personCount}p)`;
                    reservationInfo.textContent = displayText.substring(0, 18) + 
                        (displayText.length > 18 ? '...' : '');
                    dayElement.appendChild(reservationInfo);
                }
                
                dayElement.appendChild(dayNumber);
                dayElement.onclick = () => openModal(cellDate);
                calendar.appendChild(dayElement);
            }
        }

        // Navigation
        function previousMonth() {
            currentDate.setMonth(currentDate.getMonth() - 1);
            generateCalendar();
        }

        function nextMonth() {
            currentDate.setMonth(currentDate.getMonth() + 1);
            generateCalendar();
        }

        // Gestion de la modal
        function openModal(date) {
            selectedDate = date;
            const modal = document.getElementById('reservationModal');
            const form = document.getElementById('reservationForm');
            const modalTitle = document.getElementById('modalTitle');
            const deleteBtn = document.getElementById('deleteBtn');
            
            const dateKey = date.toISOString().split('T')[0];
            const existing = reservations[dateKey];
            
            if (existing) {
                modalTitle.textContent = `Modifier la réservation - ${date.toLocaleDateString('fr-FR')}`;
                document.getElementById('title').value = existing.title || '';
                document.getElementById('phone').value = existing.phone || '';
                document.getElementById('time').value = existing.time || '';
                document.getElementById('personCount').value = existing.personCount || '1';
                document.getElementById('description').value = existing.description || '';
                deleteBtn.style.display = 'inline-block';
            } else {
                modalTitle.textContent = `Nouvelle réservation - ${date.toLocaleDateString('fr-FR')}`;
                form.reset();
                // Valeur par défaut pour le nombre de personnes
                document.getElementById('personCount').value = '1';
                deleteBtn.style.display = 'none';
            }
            
            modal.style.display = 'block';
        }

        function closeModal() {
            document.getElementById('reservationModal').style.display = 'none';
        }

        // Gestion du formulaire
        document.getElementById('reservationForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            if (!selectedDate) return;
            
            const dateKey = selectedDate.toISOString().split('T')[0];
            const formData = new FormData(this);
            
            // Validation du nombre de personnes
            const personCount = parseInt(formData.get('personCount'));
            if (personCount < 1 || personCount > 100) {
                alert('Le nombre de personnes doit être entre 1 et 100');
                return;
            }
            
            reservations[dateKey] = {
                title: formData.get('title'),
                phone: formData.get('phone'),
                time: formData.get('time'),
                personCount: personCount,
                description: formData.get('description'),
                created: new Date().toISOString()
            };
            
            saveData();
            generateCalendar();
            closeModal();
        });

        // Supprimer une réservation
        function deleteReservation() {
            if (!selectedDate) return;
            
            const dateKey = selectedDate.toISOString().split('T')[0];
            delete reservations[dateKey];
            
            saveData();
            generateCalendar();
            closeModal();
        }

        // Export des données
        function exportData() {
            const dataStr = JSON.stringify(reservations, null, 2);
            const dataBlob = new Blob([dataStr], {type: 'application/json'});
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `reservations-${new Date().toISOString().split('T')[0]}.json`;
            link.click();
            URL.revokeObjectURL(url);
        }

        // Import des données
        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedData = JSON.parse(e.target.result);
                    reservations = importedData;
                    saveData();
                    generateCalendar();
                    alert('Données importées avec succès !');
                } catch (error) {
                    alert('Erreur lors de l\'import du fichier');
                }
            };
            reader.readAsText(file);
        }

        // Fermer la modal en cliquant à l'extérieur
        window.onclick = function(event) {
            const modal = document.getElementById('reservationModal');
            if (event.target === modal) {
                closeModal();
            }
        }

        // Initialisation
        loadData();
        generateCalendar();
    </script>
</body>
</html>
